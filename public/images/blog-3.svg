<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#0B0F1A"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a93a6"/>
      <stop offset="100%" stop-color="#3a4150"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <!-- grid -->
  <g stroke="#2a2f3a" stroke-width="1" opacity="0.4">
    <line x1="0" y1="225" x2="1200" y2="225"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
  </g>
  <!-- frame -->
  <rect x="30" y="30" width="1140" height="615" rx="8" fill="none" stroke="url(#silver)" stroke-width="2" opacity="0.6"/>
  <rect x="40" y="40" width="1120" height="595" rx="6" fill="none" stroke="#3a4150" stroke-width="1"/>
  <!-- corner brackets -->
  <path d="M60 90 L60 60 L90 60" fill="none" stroke="#8a93a6" stroke-width="3"/>
  <path d="M1140 60 L1110 60 L1140 90" fill="none" stroke="#8a93a6" stroke-width="3"/>
  <text x="600" y="290" text-anchor="middle" font-family="Rajdhani, sans-serif" font-size="64" font-weight="700" fill="#E6EAF2" letter-spacing="6">MARKDOWN &amp; TOC</text>
  <text x="600" y="350" text-anchor="middle" font-family="monospace" font-size="24" fill="#8a93a6" letter-spacing="6">RENDER PIPELINE</text>
  <text x="600" y="560" text-anchor="middle" font-family="monospace" font-size="18" fill="#9ca3af" letter-spacing="4">MARKDOWN | REACT-MARKDOWN | TOC</text>
</svg>

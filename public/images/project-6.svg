<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141821"/>
      <stop offset="100%" stop-color="#0B0F1A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6d2f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <!-- grid -->
  <g stroke="#2a2f3a" stroke-width="1" opacity="0.5">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="240" y1="0" x2="240" y2="675"/>
    <line x1="480" y1="0" x2="480" y2="675"/>
    <line x1="720" y1="0" x2="720" y2="675"/>
    <line x1="960" y1="0" x2="960" y2="675"/>
  </g>
  <!-- frame -->
  <rect x="30" y="30" width="1140" height="615" rx="8" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.7"/>
  <rect x="40" y="40" width="1120" height="595" rx="6" fill="none" stroke="#3a4150" stroke-width="1"/>
  <!-- corner brackets -->
  <path d="M60 90 L60 60 L90 60" fill="none" stroke="#d4af37" stroke-width="3"/>
  <path d="M1140 60 L1110 60 L1140 90" fill="none" stroke="#d4af37" stroke-width="3"/>
  <text x="600" y="290" text-anchor="middle" font-family="Rajdhani, sans-serif" font-size="88" font-weight="700" fill="#E6EAF2" letter-spacing="8">STAR MAP</text>
  <text x="600" y="360" text-anchor="middle" font-family="monospace" font-size="28" fill="#d4af37" letter-spacing="6">WEBGL VISUALIZATION</text>
  <text x="600" y="560" text-anchor="middle" font-family="monospace" font-size="18" fill="#9ca3af" letter-spacing="4">WEBGL | TYPESCRIPT | MATH</text>
</svg>
